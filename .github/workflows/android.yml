name: Build K-Lyrics APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q K-Lyrics-Android-v0.6.27-dev-source.zip -d extracted
          PROJECT_DIR="$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Kotlin source
        run: |
          FILE="$PROJECT_DIR/app/src/main/java/com/example/klyrics/KugouNotificationListener.kt"
          if [ ! -f "$FILE" ]; then
            echo "Kotlin source not found: $FILE"
            exit 1
          fi
          cat > "$FILE" <<'EOF'
          package com.example.klyrics

          import android.media.session.MediaSessionManager
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.os.Handler
          import android.os.Looper

          class KugouNotificationListener : NotificationListenerService() {
              private val handler = Handler(Looper.getMainLooper())

              override fun onListenerConnected() {
                  super.onListenerConnected()
                  refreshSessions()
              }

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  refreshSessions()
              }

              override fun onNotificationRemoved(sbn: StatusBarNotification?) {
                  refreshSessions()
              }

              private fun refreshSessions() {
                  handler.post {
                      try {
                          val manager = getSystemService(
                              Context.MEDIA_SESSION_SERVICE
                          ) as MediaSessionManager

                          val sessions = manager.getActiveSessions(
                              ComponentName(
                                  this,
                                  KugouNotificationListener::class.java
                              )
                          )

                          val controller = sessions.firstOrNull { c ->
                              val pkg = c.packageName.lowercase()
                              pkg.contains("kugou") || pkg.contains("酷狗")
                          }

                          if (controller != null) {
                              val metadata = controller.metadata
                              val title = metadata?.getString(
                                  android.media.MediaMetadata.METADATA_KEY_TITLE
                              ).orEmpty()
                              val artist = metadata?.getString(
                                  android.media.MediaMetadata.METADATA_KEY_ARTIST
                              ).orEmpty()
                              val playing = controller.playbackState?.state ==
                                  android.media.session.PlaybackState.STATE_PLAYING

                              val intent = Intent(
                                  this,
                                  LyricOverlayService::class.java
                              ).apply {
                                  action = LyricOverlayService.ACTION_UPDATE
                                  putExtra(LyricOverlayService.EXTRA_TITLE, title)
                                  putExtra(LyricOverlayService.EXTRA_ARTIST, artist)
                                  putExtra(LyricOverlayService.EXTRA_PLAYING, playing)
                              }

                              if (android.provider.Settings.canDrawOverlays(this)) {
                                  startService(intent)
                              }
                          }
                      } catch (_: SecurityException) {
                      } catch (_: Exception) {
                      }
                  }
              }
          }
          EOF

      - name: Fix JVM target
        run: |
          FILE="$PROJECT_DIR/app/build.gradle.kts"
          python3 - "$FILE" <<'PY'
          import pathlib
          import re
          import sys

          p = pathlib.Path(sys.argv[1])
          s = p.read_text()

          s, count = re.subn(
              r'(?m)^[ \t]*kotlinOptions[ \t]*\{[^{}]*\}[ \t]*\n?',
              '',
              s
          )

          if count == 0 and 'jvmTarget' in s:
              raise SystemExit("Old Kotlin target block not found; stop safely")

          s += """

          kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
                  )
              }
          }
          """
          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: K-Lyrics-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk