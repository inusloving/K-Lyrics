name: Build K-Lyrics APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: unzip -q K-Lyrics-Android-starter.zip

      - name: Build APK
        run: gradle -p K-Lyrics-Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: K-Lyrics-APK
          path: K-Lyrics-Android/app/build/outputs/apk/debug/app-debug.apk
