name: Build K-Lyrics APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q K-Lyrics-Android-starter.zip -d extracted
          PROJECT_DIR="$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Kotlin source
        run: |
          FILE="$(find extracted -name KugouNotificationListener.kt | head -n 1)"
          if [ -z "$FILE" ]; then
            echo "Kotlin source not found"
            exit 1
          fi
          python3 - "$FILE" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          s = s.replace("List<MediaSession.Token>", "List<MediaController>")
          if "import android.media.session.MediaController" not in s:
              s = s.replace(
                  "package com.example.klyrics",
                  "package com.example.klyrics\n\nimport android.media.session.MediaController",
                  1
              )
          open(p, "w").write(s)
          PY

      - name: Fix JVM target
        run: |
          FILE="$PROJECT_DIR/app/build.gradle.kts"
          if [ -f "$FILE" ]; then
            sed -i 's/jvmTarget = "17"/jvmTarget = "1.8"/g' "$FILE"
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: K-Lyrics-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk