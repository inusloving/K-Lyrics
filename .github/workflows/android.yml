name: Build K-Lyrics APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Find and extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname '*.zip' -type f | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -type f -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set Java target to 17
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["PROJECT_DIR"]) / "app/build.gradle.kts"
          s = p.read_text()
          s = s.replace(
              "    kotlinOptions {",
              "    compileOptions {\n"
              "        sourceCompatibility = JavaVersion.VERSION_17\n"
              "        targetCompatibility = JavaVersion.VERSION_17\n"
              "    }\n\n"
              "    kotlinOptions {"
          )
          p.write_text(s)
          print("Java and Kotlin targets aligned to 17")
          PY

      - name: Build APK
        id: build
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug
          APK_PATH=$(find "$PROJECT_DIR" -path '*/outputs/apk/debug/*.apk' -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: K-Lyrics-APK
          path: ${{ steps.build.outputs.apk_path }}
